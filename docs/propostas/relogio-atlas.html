<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Relógio do Atlas · proposta interativa</title>
  <style>
    html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; display: block; background: #0c0f15; color: #f3eee4 }
    a { color: #e2b872; font: 18px system-ui; padding: 2rem; display: block }
  </style>
</head>
<body>
  <iframe id="atlas" title="Atlas com a proposta de relógio"></iframe>
  <script>
    const frame = document.getElementById('atlas');
    if (location.protocol === 'file:') {
      const link = document.createElement('a');
      link.href = 'http://localhost:5173/docs/propostas/relogio-atlas.html';
      link.textContent = 'Abrir a proposta no Atlas local';
      frame.replaceWith(link);
    } else {
      frame.src = '../../?atlas=1&foco=saturno&ver=corpo&lang=pt';
      frame.addEventListener('load', () => {
        const script = frame.contentDocument.createElement('script');
        script.type = 'module';
        script.src = new URL('./relogio-atlas.tsx', location.href).href;
        frame.contentDocument.head.append(script);
      });
    }
  </script>
</body>
</html>
