# Publica o filme no GitHub Pages a cada commit na main.
#
# O site de PROJETO fica num subcaminho (/Viagem-Sol-pela-Milky-Way/), e é por
# isso que o `base: './'` do vite.config.ts não é detalhe: com ele o
# `import.meta.env.BASE_URL` vira './', os fetch de `data/` resolvem relativo ao
# documento e os preload do index.html também. Trocar esse `base` para '/'
# quebra os 13 MB de cartografia em produção sem quebrar nada no dev server —
# falha que só aparece publicada.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # permite republicar sem commit novo (útil depois de mexer em Settings)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy não se atropela: uma publicação por vez, e a fila NÃO cancela a que
# está no meio — cancelar um deploy de Pages deixa o site num estado meio
# trocado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # majors atuais (v7/v5): as v4 declaravam Node 20, que o runner já força
      # para 24 com aviso de depreciação — funciona hoje, quebra quando
      # removerem o suporte
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # OS PORTÕES QUE FALTAVAM. Até 2026-08-13 este fluxo rodava `npm run
      # build` e MAIS NADA: os testes e o eslint só existiam se alguém
      # lembrasse de rodá-los na própria máquina, e um vermelho ia
      # publicado sem ninguém ver. Aqui eles são PORTÃO — um `run` que
      # falha derruba o job `build`, e `deploy` tem `needs: build`, então
      # nada chega ao Pages.
      #
      # A ORDEM é do mais barato para o mais caro: o eslint devolve em
      # segundos e o vitest leva a leva inteira, então o lint primeiro
      # gasta menos runner para dar a mesma notícia.
      #
      # O QUE NÃO ENTRA, e por quê: as capturas visuais (`scripts/visual/
      # rodada.mjs`, `a11y.mjs`, `atlas-smoke.mjs`…) pedem GPU real e um
      # Chrome dirigido por CDP. Num runner sem placa elas falhariam por
      # falta de máquina e não por defeito do código — portão que acusa
      # inocente é pior que portão nenhum. Elas seguem sendo levas de
      # bancada, rodadas à mão.
      - run: npm run lint

      # ATENÇÃO ao que `npm test` arrasta: o `include` do vitest.config.ts
      # é `src/**/*.test.ts` + `scripts/**/*.test.mjs`, e essas três de
      # `scripts/visual/` (chrome, ab-identidade, planeta-pixel) importam
      # `chrome.mjs`, que resolve o BINÁRIO do Chrome no topo do módulo e
      # lança `Chrome não encontrado` se não achar. Elas não sobem captura
      # nenhuma (a leva mora atrás da guarda de `process.argv[1]`) — mas o
      # import só sobrevive porque a imagem `ubuntu-latest` já traz o
      # Google Chrome em `/usr/bin/google-chrome`, que é um dos caminhos
      # que `chrome.mjs` procura no `linux`. Se um dia esse fluxo virar
      # vermelho com essa mensagem, o defeito é ESTE acoplamento, não o
      # código de `src/`.
      - run: npm test

      # `npm run build` é `tsc -b && vite build`: o typecheck é o terceiro
      # portão, e o último. Se o TypeScript não passar, nada é publicado.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
