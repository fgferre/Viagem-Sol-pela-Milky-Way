<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Uma viagem cinematográfica por 18.543 estrelas do catálogo HYG e pela Via Láctea completa."
    />
    <meta name="theme-color" content="#010208" />
    <link rel="icon" href="data:," />
    <!--
      Os 13 MB de dados só nasciam quando o bundle terminava de baixar,
      parsear e executar — e os .bin da galáxia ainda esperavam a viagem do
      manifesto. Os nomes são fixos, então a rede pode começar junto com o JS.
      O crossorigin é OBRIGATÓRIO: o código usa fetch() puro (modo cors) e,
      sem ele, o preload não casa com a requisição e o browser baixa TUDO
      duas vezes. Nada muda no que é renderizado — só quando os bytes chegam.
    -->
    <!-- Os .bin viajam como .gz (o Pages não comprime octet-stream; o app
         descomprime no cliente — fetchBinary em config.ts). O preload tem de
         apontar para o MESMO arquivo que o fetch pede, senão vira download
         dobrado. JSON fica cru: a borda já o comprime. -->
    <link rel="preload" as="fetch" crossorigin href="./data/stars.bin.gz" />
    <link rel="preload" as="fetch" crossorigin href="./data/stars_meta.json" />
    <link rel="preload" as="fetch" crossorigin href="./data/galaxy/manifest.json" />
    <link rel="preload" as="fetch" crossorigin href="./data/galaxy/dust-density.bin.gz" />
    <link rel="preload" as="fetch" crossorigin href="./data/galaxy/gaia-ob-proxy-stars.bin.gz" />
    <title>Mar de Estrelas — Viagem pela Via Láctea</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
